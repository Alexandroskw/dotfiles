# Cambiando el prefijo por defecto de Tmux (Ctrl + B)
set -g prefix C-a
unbind C-b
bind-key C-a send-prefix

# Instalador de plugins
set -g @plugin 'tmux-plugins/tpm'

# Plugins instalados
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'o0th/tmux-nova'
set -g @plugin 'tmux-plugins/tmux-cpu'

# configuración de la barra de estado
set -g @nova-pane-justify "centre"

set -g @nova-nerdfonts true
set -g @nova-nerdfonts-left 
set -g @nova-nerdfonts-right 
set -g @nova-pane "#I #W"
set -g @nova-rows 0

b_bg="#504945"

seg_a="#a89984 #282828"
seg_b="$b_bg #ddc7a1"

inactive_bg="#32302f"
inactive_fg="#ddc7a1"
active_bg=$b_bg
active_fg="#ddc7a1"

set -gw window-status-current-style bold
set -g "@nova-status-style-bg" "$inactive_bg"
set -g "@nova-status-style-fg" "$inactive_fg"
set -g "@nova-status-style-active-bg" "$active_bg"
set -g "@nova-status-style-active-fg" "$active_fg"

set -g "@nova-pane-active-border-style" "#44475a"
set -g "@nova-pane-border-style" "#827d51"

set -g @nova-segment-prefix "#{?client_prefix,PREFIX,}"
set -g @nova-segment-prefix-colors "$seg_b"

set -g @nova-segment-session " #{session_name}"
set -g @nova-segment-session-colors "$seg_a"

set -g @nova-segment-whoami "#(whoami)@#h"
set -g @nova-segment-whoami-colors "$seg_a"

set -g @nova-segments-0-left "session"
set -g @nova-segments-0-right "prefix cpu battery layout whoami"

set -g status-position top

# Dividir el panel en vertical
unbind %
bind | split-window -h -c "#{pane_current_path}"

# Dividir el panel en horizontal
unbind '"'
bind - split-window -v -c "#{pane_current_path}"

# Limpiar terminal
bind L send-keys 'C-l'

# Índices de los paneles se inician en 1
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Recargar la configuración de Tmux
unbind r
bind r source-file ~/.config/tmux/tmux.conf

# movimiento en los páneles de tmux
bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5
bind -r h resize-pane -L 5

set-window-option -g mode-keys vi

# reescalar los páneles con el mouse
bind -r m resize-pane -Z

# set-option -g default-shell "/bin/zsh"

# Habilitar el mouse
set -g mouse on

run '~/.tmux/plugins/tpm/tpm'
