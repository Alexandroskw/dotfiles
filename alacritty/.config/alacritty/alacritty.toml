[general]
import = [ "~/.config/alacritty/themes/themes/nightfox.toml" ]

[env]
TERM = "alacritty"

[cursor]
style = { blinking = "Always" }
blink_interval = 520

[mouse]
hide_when_typing = true

[colors]
draw_bold_text_with_bright_colors = true

[window]
opacity = 0.8
decorations = "Full"
startup_mode = "Maximized"
dynamic_title = true
class = { instance = "Alacritty", general = "Alacritty" }
dimensions = { columns = 186, lines = 72 }

[terminal.shell]
program = "/bin/bash"

[font]
size = 11
normal = { family = "FiraMono Nerd Font Propo Medium", style = "Regular" }
bold = { family = "FiraCode Nerd Font Mono SemBd", style = "Bold" }
italic = { family = "Agave Nerd Font Mono", style = "Italic" }

[terminal]
osc52 = "CopyPaste"
