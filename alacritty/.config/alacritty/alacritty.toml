[general]
import = [
    "~/.config/alacritty/themes/themes/nightfox.toml"
]

[env]
TERM = "xterm-256color"

[colors]
draw_bold_text_with_bright_colors = true

[window]
opacity = 0.8
decorations = "Full"
startup_mode = "Maximized"
dynamic_title = true
class = { instance = "Alacritty", general = "Alacritty" }
dimensions = { columns = 186, lines = 72 }

[terminal.shell]
program = "/bin/bash"


[font]
size = 10.5
normal = { family = "FiraCode Nerd Font Propo Med", style = "Regular" }
bold = { family = "FiraCode Nerd Font Mono SemBd", style = "Bold" }
italic = { family = "Agave Nerd Font Mono", style = "Italic" }

[terminal]
osc52 = "CopyPaste"
